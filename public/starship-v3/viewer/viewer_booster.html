<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星舰 V3 · Super Heavy 助推器 - 交互式 3D 查看器</title>
<style>
  :root { --navy:#1f3a5f; --accent:#2f6db5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#05070b; color:#d7dde4;
              font-family:"PingFang SC","Heiti SC","Microsoft YaHei",sans-serif; }
  #app { position:fixed; inset:0; }
  #hint { position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
          font-size:12px; color:#8fa0b5; background:rgba(8,12,18,.78);
          padding:6px 14px; border-radius:20px; border:1px solid #22334a;
          pointer-events:none; white-space:nowrap; z-index:5; }
  #status { position:absolute; top:14px; left:50%; transform:translateX(-50%);
            font-size:13px; color:#dfe7f0; background:rgba(31,58,95,.92);
            padding:8px 16px; border-radius:8px; border:1px solid #3b5f8f;
            display:none; z-index:40; max-width:70%; text-align:center; }
  #panel { position:absolute; top:14px; left:14px; width:252px; max-height:calc(100% - 40px);
           overflow-y:auto; background:rgba(10,14,20,.93); border:1px solid #22334a;
           border-radius:12px; padding:14px 14px 10px; z-index:10;
           backdrop-filter:blur(6px); }
  #panel h1 { font-size:15px; color:#fff; margin-bottom:2px; letter-spacing:.5px; }
  #panel .sub { font-size:11px; color:#7f92a8; margin-bottom:10px; }
  .grp { font-size:11px; color:#aebfcf; margin:8px 0 4px; font-weight:600;
         border-bottom:1px solid #1c2938; padding-bottom:2px; }
  label { display:flex; align-items:center; gap:7px; font-size:12px;
          padding:2.5px 0; cursor:pointer; user-select:none; }
  label:hover { color:#fff; }
  input[type=checkbox] { accent-color:var(--accent); }
  .slider-row { display:flex; align-items:center; gap:8px; font-size:12px; margin-top:4px; }
  input[type=range] { flex:1; accent-color:var(--accent); }
  .btn-row { display:flex; gap:8px; margin-top:8px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:6px;
           padding:5px 10px; font-size:12px; cursor:pointer; flex:1; }
  button:hover { background:var(--accent); }
  #stats { font-size:11px; color:#7f92a8; margin-top:8px; }
  #panel::-webkit-scrollbar { width:5px; }
  #panel::-webkit-scrollbar-thumb { background:#22344c; border-radius:3px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="status"></div>
<div id="panel">
  <h1>星舰 V3 · Super Heavy 助推器</h1>
  <div class="sub">Super Heavy 助推器 · 照片级渲染 · 高约 74 m</div>
  <div class="grp">部件显示</div>
  <label><input type="checkbox" data-c="hot_stage" checked> 热分级环</label>
  <label><input type="checkbox" data-c="booster_engines" checked> 发动机 ×33</label>
  <label><input type="checkbox" data-c="grid_fins" checked> 栅格舵 ×3</label>
  <label><input type="checkbox" data-c="pins" checked> 吊装销</label>
  <div class="grp">爆炸图</div>
  <div class="slider-row"><span>0</span><input type="range" id="explode" min="0" max="26" value="0" step="0.5"><span>26 m</span></div>
  <div class="btn-row">
    <button id="btnExplode">爆炸图</button>
    <button id="reset">复位</button>
  </div>
  <div id="stats"></div>
</div>
<div id="hint">左键旋转 · 右键平移 · 滚轮缩放 · 自动旋转</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script>
var GLB_B64 = "";
var GLB_URL = "superheavy.glb";
(function () {
  var statusEl = document.getElementById("status");
  function showStatus(msg, isError) {
    statusEl.style.display = "block";
    statusEl.textContent = msg;
    if (isError) statusEl.style.background = "rgba(138,31,31,.95)";
  }

  // ---- WebGL support check --------------------------------------------
  var testCanvas = document.createElement("canvas");
  var glTest = testCanvas.getContext("webgl2") || testCanvas.getContext("webgl");
  if (!glTest) {
    showStatus("当前浏览器/环境不支持 WebGL，无法显示 3D。请改用 Safari、Chrome 或 Edge 打开本文件。", true);
    return;
  }

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070b);
  var camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 2000);
  camera.position.set(60, 45, 100);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.getElementById("app").appendChild(renderer.domElement);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 62, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.55;
  controls.maxPolarAngle = Math.PI * 0.9;
  controls.minDistance = 15;
  controls.maxDistance = 420;

  // ---- photoreal environment (procedural sky, no external files) -------
  function makeEnvTexture() {
    var c = document.createElement("canvas");
    c.width = 1024; c.height = 512;
    var ctx = c.getContext("2d");
    var g = ctx.createLinearGradient(0, 0, 0, 512);
    g.addColorStop(0.0, "#3f6fae");
    g.addColorStop(0.35, "#79aad8");
    g.addColorStop(0.52, "#cfe6f5");
    g.addColorStop(0.56, "#eef6fc");
    g.addColorStop(0.58, "#5c574c");
    g.addColorStop(1.0, "#22221f");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1024, 512);
    // sun glow upper right
    var rg = ctx.createRadialGradient(760, 150, 20, 760, 150, 260);
    rg.addColorStop(0, "rgba(255,250,235,1)");
    rg.addColorStop(0.2, "rgba(255,235,190,0.7)");
    rg.addColorStop(1, "rgba(255,220,160,0)");
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, 1024, 512);
    var tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    return tex;
  }
  var pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(makeEnvTexture()).texture;

  // ---- lights ----------------------------------------------------------
  var hemi = new THREE.HemisphereLight(0xcfe3f7, 0x39424d, 0.7);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xfff1dd, 2.6);
  sun.position.set(90, 150, 70);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
  sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
  sun.shadow.camera.near = 10; sun.shadow.camera.far = 400;
  scene.add(sun);
  var rim = new THREE.DirectionalLight(0x88aadd, 0.9);
  rim.position.set(-90, 60, -110);
  scene.add(rim);

  // ---- ground ----------------------------------------------------------
  var ground = new THREE.Mesh(
    new THREE.CircleGeometry(160, 64),
    new THREE.MeshStandardMaterial({ color: 0x0c1016, metalness: 0.55, roughness: 0.72 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -2;
  ground.receiveShadow = true;
  scene.add(ground);
  var grid = new THREE.GridHelper(220, 24, 0x1c2f45, 0x101d2c);
  grid.position.y = -1.95;
  scene.add(grid);

  var meshes = [];
  var root = null;
  var groups = {};
  var explodeValue = 0;
  var explodeTarget = 0;

  function makeMat(kind) {
    var base = { envMapIntensity: 1.35, clearcoat: 0.1 };
    switch (kind) {
      case "steel":  return new THREE.MeshPhysicalMaterial(Object.assign(base, { color: 0xcfd4d9, metalness: 0.82, roughness: 0.28 }));
      case "dark":   return new THREE.MeshPhysicalMaterial(Object.assign(base, { color: 0x969ca4, metalness: 0.78, roughness: 0.42 }));
      case "engine": return new THREE.MeshPhysicalMaterial(Object.assign(base, { color: 0x52575e, metalness: 0.9, roughness: 0.48 }));
      case "tile":   return new THREE.MeshPhysicalMaterial({ color: 0x181a1e, metalness: 0.03, roughness: 0.92, envMapIntensity: 0.35 });
      case "ring":   return new THREE.MeshPhysicalMaterial(Object.assign(base, { color: 0xacb2b8, metalness: 0.78, roughness: 0.45 }));
      case "pin":    return new THREE.MeshPhysicalMaterial(Object.assign(base, { color: 0xd6dadd, metalness: 0.9, roughness: 0.25 }));
      case "payload":return new THREE.MeshPhysicalMaterial(Object.assign(base, { color: 0xa2a9b0, metalness: 0.82, roughness: 0.38 }));
    }
    return new THREE.MeshPhysicalMaterial(Object.assign(base, { color: 0xcfd4d9, metalness: 0.82, roughness: 0.28 }));
  }

  function materialFor(name) {
    if (name.indexOf("tps_tiles") >= 0) return "tile";
    if (name.indexOf("engines") >= 0 || name.indexOf("engine_bay") >= 0) return "engine";
    if (name.indexOf("grid_fins") >= 0 || name.indexOf("flaps") >= 0) return "dark";
    if (name.indexOf("hot_stage") >= 0) return "ring";
    if (name.indexOf("lift_pins") >= 0) return "pin";
    if (name.indexOf("payload") >= 0) return "payload";
    return "steel";
  }

  function hexTileTexture() {
    var c = document.createElement("canvas");
    c.width = 512; c.height = 1024;
    var ctx = c.getContext("2d");
    ctx.fillStyle = "#14161a";
    ctx.fillRect(0, 0, 512, 1024);
    var h = 40, v = 70; // hexes per row/col
    var w = c.width / h;
    var r = w * 0.78;
    for (var row = 0; row < v; row++) {
      for (var col = 0; col < h; col++) {
        var cx = col * w + (row % 2 ? w / 2 : 0);
        var cy = row * (c.height / v);
        ctx.beginPath();
        for (var k = 0; k < 6; k++) {
          var a = Math.PI / 6 + k * Math.PI / 3;
          var px = cx + r * Math.cos(a);
          var py = cy + r * Math.sin(a);
          k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = "#0d0e11";
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.10)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
    var tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 8;
    return tex;
  }

  function fitCamera(extra) {
    var box = new THREE.Box3().setFromObject(root);
    var c = box.getCenter(new THREE.Vector3());
    var r = box.getBoundingSphere(new THREE.Sphere()).radius * (extra || 1);
    controls.target.copy(c);
    camera.position.set(c.x + r * 1.05, c.y + r * 0.72, c.z + r * 1.5);
    camera.near = r / 120;
    camera.far = r * 60;
    camera.updateProjectionMatrix();
  }

  function explode(v) {
    meshes.forEach(function (m) {
      var n = m.name;
      var dy = 0;
      if (n.indexOf("ship/") === 0) dy = v;
      if (n.indexOf("engines") >= 0 && n.indexOf("booster/") === 0) dy = -v * 0.8;
      if (n.indexOf("grid_fins") >= 0) dy = v * 0.55;
      if (n.indexOf("flaps") >= 0) dy = -v * 0.45;
      m.position.z = dy;
    });
  }

  function applyVisibility() {
    meshes.forEach(function (m) {
      var n = m.name;
      m.visible = true;
      // checked == shown; unchecked == hidden
      if (groups.booster === false && n.indexOf("booster/") === 0) m.visible = false;
      if (groups.ship === false && n.indexOf("ship/") === 0) m.visible = false;
      var cat = n.split("/")[1];
      var map = {
        nose_cone: "nose_cone", payload: "payload", tanks: "tanks",
        aft_flaps: "flaps", forward_flaps: "flaps",
        engine_bay: "engine_bay", engines: "booster_engines",
        grid_fins: "grid_fins", hot_stage_ring: "hot_stage",
        tps_tiles: "tps", lift_pins: "pins"
      };
      var key = map[cat];
      if (key && groups[key] === false) m.visible = false;
    });
  }

  document.querySelectorAll("#panel input[type=checkbox]").forEach(function (cb) {
    cb.addEventListener("change", function () {
      if (cb.dataset.g) groups[cb.dataset.g] = cb.checked;
      else groups[cb.dataset.c] = cb.checked;
      applyVisibility();
      updateStats();
    });
  });
  // initialise visibility state from the checkboxes (checked == shown)
  document.querySelectorAll("#panel input[type=checkbox]").forEach(function (cb) {
    if (cb.dataset.g) groups[cb.dataset.g] = cb.checked;
    else groups[cb.dataset.c] = cb.checked;
  });
  document.getElementById("explode").addEventListener("input", function (e) {
    explodeTarget = parseFloat(e.target.value);
    explodeValue = explodeTarget;
    explode(explodeValue);
  });
  document.getElementById("btnExplode").addEventListener("click", function () {
    explodeTarget = explodeTarget > 0.5 ? 0 : 18;
    document.getElementById("explode").value = explodeTarget;
    fitCamera(1.25);
  });
  document.getElementById("reset").addEventListener("click", function () {
    explodeTarget = 0;
    document.getElementById("explode").value = 0;
    fitCamera(1);
  });

  function updateStats() {
    document.getElementById("stats").textContent =
      "\u90e8\u4ef6\u6570\uff1a" + meshes.length + " · 全高 74.0 m · 直径 9.0 m";
  }

  addEventListener("resize", function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  function onModelLoaded(gltf) {
    root = gltf.scene;
      // glTF is Y-up; the model's long axis is Z -> stand it upright
    root.rotation.x = -Math.PI / 2;
    var tileTex = hexTileTexture();
    root.traverse(function (o) {
      if (!o.isMesh) return;
      // GLTFLoader sanitises node names (removes "/"); restore the real name
      o.name = (o.userData && o.userData.name) || o.name;
      var kind = materialFor(o.name);
      o.material = makeMat(kind);
      if (kind === "tile") {
        // cylindrical UV for the TPS strip so the hex texture maps correctly
        var pos = o.geometry.attributes.position;
        var uv = new Float32Array(pos.count * 2);
        for (var i = 0; i < pos.count; i++) {
          var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
          var u = (Math.atan2(x, z) / (2 * Math.PI)) + 0.5;
          var v = y / 55;
          uv[i * 2] = u; uv[i * 2 + 1] = v;
        }
        o.geometry.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
        o.material.map = tileTex;
        o.material.roughnessMap = tileTex;
        o.material.bumpMap = tileTex;
        o.material.bumpScale = 0.8;
      }
      o.castShadow = true;
      meshes.push(o);
    });
    scene.add(root);
    fitCamera(1);
    updateStats();
    applyVisibility();  // respect any toggles made while the model was loading
    statusEl.style.display = "none";
  }

  function loadModel() {
    showStatus("\u6b63\u5728\u52a0\u8f7d\u6a21\u578b\u4e0e\u6750\u8d28\u2026");
    var attempts = 0;
    function onError(err) {
      attempts++;
      var msg = err && err.message ? err.message : "\u672a\u77e5\u9519\u8bef";
      if (attempts === 1 && GLB_URL) {
        showStatus("\u9996\u6b21\u52a0\u8f7d\u5931\u8d25\uff0c\u6b63\u5728\u81ea\u52a8\u91cd\u8bd5\u2026");
        fetchGLB();
      } else {
        showStatus("\u6a21\u578b\u52a0\u8f7d\u5931\u8d25\uff1a" + msg +
          "\uff08\u53ef\u5173\u95ed\u9875\u9762\u91cd\u8bd5\uff09", true);
      }
    }
    function parse(buf) {
      new THREE.GLTFLoader().parse(buf, "", onModelLoaded, onError);
    }
    function fetchGLB() {
      fetch(GLB_URL).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.arrayBuffer();
      }).then(parse).catch(onError);
    }
    if (GLB_B64) {
      try {
        var bin = Uint8Array.from(atob(GLB_B64), function (c) { return c.charCodeAt(0); });
        parse(bin.buffer);
      } catch (e) {
        onError(e);
      }
    } else if (GLB_URL) {
      fetchGLB();
    } else {
      showStatus("\u6a21\u578b\u6570\u636e\u7f3a\u5931\uff0c\u65e0\u6cd5\u52a0\u8f7d", true);
    }
  }

  // debug/test hook (harmless; used by render-capture scripts)
  window.__viewer = {
    get root() { return root; },
    get meshes() { return meshes; },
    scene: scene,
    camera: camera,
    controls: controls,
    renderer: renderer,
    explode: explode,
    fitCamera: fitCamera
  };

  function loop() {
    if (Math.abs(explodeTarget - explodeValue) > 0.02) {
      explodeValue += (explodeTarget - explodeValue) * 0.08;
      explode(explodeValue);
      document.getElementById("explode").value = explodeValue.toFixed(1);
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loadModel();
  loop();
})();
</script>
</body>
</html>
